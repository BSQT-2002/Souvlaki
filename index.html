<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1b1d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="souvlaki">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>souvlaki</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,0,0" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f7f7f5;
      --surface: #ffffff;
      --text-main: #171717;
      --text-muted: #7d7d82;
      --input-bg: #eeeeec;
      --nav-bg: #1b1b1d;
      --c-purple: #d9b8ff;
      --c-lime: #dfff57;
      --c-blue: #5367e8;
      --c-orange: #ff6845;
      --c-pink: #ffb4eb;
      --c-cyan: #9ee8df;
      --c-danger: #ff3b30;
      --shadow: 0 14px 35px rgba(20,20,20,.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body { font-family: 'Inter', sans-serif; background: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden; }
    .app-container { width: 100%; max-width: 520px; position: relative; padding: 22px 18px 116px; }

    /* HEADER */
    header { display: flex; align-items: center; justify-content: center; margin-bottom: 24px; position: relative; min-height: 52px; }
    .brand-wordmark { font-size: 2.8rem; font-weight: 800; letter-spacing: -2.7px; text-transform: lowercase; line-height: 1; }
    .btn-add-top { font-size: 2rem; font-weight: 400; background: none; border: none; color: var(--text-main); cursor: pointer; position: absolute; right: 0; }

    /* BUSCADOR */
    .search-container { position: relative; margin-bottom: 16px; }
    .search-container .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem; pointer-events: none; }
    .search-container input, .search-container select { width: 100%; background: var(--input-bg); border: none; border-radius: 99px; padding: 15px 58px 15px 44px; font-size: .95rem; font-family: inherit; color: var(--text-main); outline: none; }
    .search-filter-btn { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer; transition: background .2s, color .2s, transform .2s; }
    .search-filter-btn:hover { background: rgba(0,0,0,.06); color: var(--text-main); }
    .search-filter-btn.active { background: var(--text-main); color: #fff; }
    .search-filter-btn:active { transform: translateY(-50%) scale(.94); }
    .filter-panel { display: none; background: var(--input-bg); border-radius: 20px; padding: 10px; margin: -4px 0 14px; box-shadow: 0 8px 22px rgba(0,0,0,.06); animation: filterIn .18s ease; }
    .filter-panel.open { display: block; }
    .filter-panel-title { font-size: .68rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .06em; padding: 5px 7px 8px; }
    .filter-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .filter-chip { border: 0; background: #fff; color: #555; border-radius: 13px; padding: 10px 11px; font: 600 .75rem Inter,sans-serif; cursor: pointer; text-align: left; transition: background .2s, color .2s, transform .15s; }
    .filter-chip.active { background: #171717; color: #fff; }
    .filter-chip:active { transform: scale(.98); }
    @keyframes filterIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

    .view { display: none; animation: fade 0.3s ease; }
    .view.active { display: block; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

    /* ESTRUCTURA APPLE WALLET & SWIPE */
    .card-list { display: flex; flex-direction: column; gap: 0; padding-top: 8px; perspective: 1200px; }
    
    .card-wrapper { 
      position: relative; 
      margin-bottom: -18px; 
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease; 
      will-change: transform, opacity; 
    }
    .card-wrapper:last-child { margin-bottom: 0; }

    .card-wrapper.expanded { z-index: 300 !important; }
    .card-wrapper.expanded .wallet-card { box-shadow: 0 40px 80px rgba(0,0,0,0.3) !important; }
    .card-wrapper.dimmed { transform: translateY(120vh) !important; opacity: 0; pointer-events: none; }

    .swipe-container { width: 100%; will-change: transform; }

    .swipe-background {
      position: absolute; top: 0; left: 0; right: 0; bottom: 18px;
      background: var(--c-danger); border-radius: 28px;
      display: flex; align-items: center; justify-content: flex-end; padding-right: 28px;
      color: white; z-index: -1;
      opacity: 0; 
      transition: opacity 0.2s ease;
    }
    
    .wallet-card { 
      min-height: 148px; border-radius: 28px; padding: 22px 22px 42px; display: flex; flex-direction: column; 
      position: relative; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,.10); 
      border: 1px solid rgba(255,255,255,.22); transform-style: preserve-3d; 
    }

    .wallet-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.05) 40%, rgba(0,0,0,0.1) 100%);
      border-radius: inherit; pointer-events: none; z-index: 10;
    }
    
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    
    .card-title { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.8px; line-height: 1.05; transform: translateZ(25px); }
    .card-pills { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 12px; transform: translateZ(25px); }
    .pill { border: 1px solid currentColor; border-radius: 99px; padding: 5px 10px; font-size: .68rem; font-weight: 600; opacity: .78; background: rgba(255,255,255,.08); }
    .card-action-btn { position: absolute; bottom: 18px; right: 18px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,.78); color: #fff; display: flex; align-items: center; justify-content: center; transform: translateZ(35px); }
    
    .theme-purple { background: var(--c-purple); color: #000; }
    .theme-lime { background: var(--c-lime); color: #000; }
    .theme-blue { background: var(--c-blue); color: #FFF; }
    .theme-orange { background: var(--c-orange); color: #FFF; }
    .theme-pink { background: var(--c-pink); color: #000; }
    .theme-cyan { background: var(--c-cyan); color: #000; }
    .theme-purple .card-action-btn span, .theme-lime .card-action-btn span, .theme-pink .card-action-btn span, .theme-blue .card-action-btn span, .theme-orange .card-action-btn span, .theme-cyan .card-action-btn span { color: #fff; }

    /* NAVEGACION */
    .bottom-nav { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--nav-bg); padding: 12px 18px; border-radius: 99px; display: flex; gap: 8px; box-shadow: 0 16px 32px rgba(0,0,0,.25); z-index: 100; width: min(360px, calc(100vw - 28px)); justify-content: space-around; }
    .nav-item { color: #777; background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-family: inherit; transition: color .2s, transform .2s; padding: 4px 18px; border-radius: 999px; }
    .nav-item.active { color: #FFFFFF; background: rgba(255,255,255,.10); } .nav-item:active { transform: scale(.96); }
    .empty-state { text-align:center; color:var(--text-muted); padding:56px 20px; }
    .connection-state { font-size:.72rem; color:var(--text-muted); text-align:center; margin:4px 0 8px; min-height:16px; }

    /* MODALES */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    
    .bottom-sheet { position: fixed; bottom: -100%; left: 0; right: 0; background: var(--bg-color); border-radius: 32px 32px 0 0; padding: 24px 24px 50px; z-index: 201; transition: bottom 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); max-height: 85vh; overflow-y: auto; max-width: 480px; margin: 0 auto; box-shadow: 0 -10px 40px rgba(0,0,0,0.1); }
    .modal-overlay.active + .bottom-sheet, .bottom-sheet.active { bottom: 0; }
    #modal-detalle { padding-top: 40px; } 
    
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .sheet-header h2 { font-size: 1.4rem; font-weight: 700; }
    .close-btn { background: var(--input-bg); border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); }

    /* FORMULARIOS Y BOTONES */
    form { display: flex; flex-direction: column; gap: 16px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; gap: 12px; }
    .input-row > * { flex: 1; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-left: 4px; }
    input, select, textarea { background: var(--input-bg); border: none; border-radius: 16px; padding: 16px; font-size: 0.95rem; font-family: inherit; color: var(--text-main); width: 100%; outline: none; }
    
    .segmented-control { display: flex; background: var(--input-bg); border-radius: 12px; padding: 4px; margin-bottom: 8px; }
    .segment-btn { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
    .segment-btn.active { background: #FFFFFF; color: var(--text-main); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

    .btn-main { background: var(--text-main); color: var(--bg-color); border: none; border-radius: 99px; padding: 18px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-danger { background: transparent; color: var(--c-danger); border: 2px solid var(--c-danger); border-radius: 99px; padding: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--text-main); color: var(--bg-color); padding: 14px 24px; border-radius: 99px; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; z-index: 1000; transition: transform 0.4s; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .detail-section { background: var(--input-bg); padding: 16px; border-radius: 16px; margin-bottom: 12px; }
    .detail-title { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-bottom: 8px; letter-spacing: 0.5px; }
    .detail-item { font-size: 0.95rem; margin-bottom: 8px; display: flex; gap: 8px; align-items: flex-start; }
    .detail-item:last-child { margin-bottom: 0; }

    .section-heading { margin: 4px 0 20px; }
    .section-heading h2 { font-size:2rem; line-height:1; letter-spacing:-1px; }
    .section-heading p { color:var(--text-muted); font-size:.82rem; margin-top:7px; }
    
    .birthday-field { position:relative; display:flex; align-items:center; gap:8px; background:var(--input-bg); border-radius:16px; min-height:52px; padding:0 12px 0 14px; }
    .birthday-field > .material-symbols-rounded { color:var(--text-muted); font-size:1.2rem; }
    .birthday-field input[type="text"] { background:transparent; padding:14px 4px; flex:1; min-width:0; }
    .birthday-field input[type="text"]::placeholder { color:#96969b; }
    .birthday-clear { width:30px; height:30px; border:0; border-radius:50%; background:rgba(0,0,0,.07); color:var(--text-muted); display:grid; place-items:center; cursor:pointer; }
    .birthday-clear .material-symbols-rounded { font-size:1rem; }
    .native-date-picker { position:absolute !important; width:1px !important; height:1px !important; opacity:0 !important; pointer-events:none !important; left:14px; top:50%; }
    .field-hint { color:var(--text-muted); font-size:.68rem; margin-left:4px; }
    .nav-label { font-size:.65rem; font-weight:700; letter-spacing:.01em; }
    @media (display-mode: standalone) { .app-container { padding-top: max(22px, env(safe-area-inset-top)); } .bottom-nav { bottom: max(16px, env(safe-area-inset-bottom)); } }
    @media (max-width: 380px) { .app-container { padding-left:14px; padding-right:14px; } .wallet-card { min-height:138px; padding:20px 18px 40px; } .card-title { font-size:1.4rem; } .nav-item { padding-left:12px; padding-right:12px; } }
  </style>
</head>
<body>

<div class="app-container">
  
  <header>
    <h1 class="brand-wordmark">souvlaki</h1>
    <button class="btn-add-top" id="btnGlobalAdd" onclick="abrirModal('modal-nuevo')">+</button>
  </header>

  <!-- HOME -->
  <main id="view-home" class="view active">
    <div class="search-container">
      <span class="material-symbols-rounded search-icon">search</span>
      <input type="text" id="inputBuscar" placeholder="Buscar contacto..." autocomplete="off" oninput="filtrarContactos()">
      <button type="button" id="btnFiltro" class="search-filter-btn" aria-label="Filtrar contactos">
        <span class="material-symbols-rounded">tune</span>
      </button>
    </div>
    <div id="panelFiltros" class="filter-panel">
      <div class="filter-panel-title">Filtrar por círculo</div>
      <div id="filtrosCirculo" class="filter-options"></div>
    </div>
    <div id="estadoConexion" class="connection-state"></div>
    <div id="listaContactos" class="card-list">
      <div style="text-align:center; color: var(--text-muted); padding: 40px 0;">Cargando directorio...</div>
    </div>
  </main>

  <!-- LOG Y NOTAS -->
  <main id="view-log" class="view">
    <div class="section-heading"><h2>Notas</h2><p>Guardá una charla, plan o momento.</p></div>
    <form id="formRegistroGlobal">
      <div class="segmented-control">
        <button type="button" class="segment-btn active" id="btnConvGlobal" onclick="setTipoRegGlobal('conversacion')">Conversación</button>
        <button type="button" class="segment-btn" id="btnActGlobal" onclick="setTipoRegGlobal('actividad')">Actividad</button>
      </div>
      
      <!-- Selector de Contacto con estilo Barra de Búsqueda y botón Nuevo Integrado -->
      <div class="input-group">
        <label>Contacto</label>
        <div class="search-container" style="margin-bottom: 0;">
          <span class="material-symbols-rounded search-icon">person_search</span>
          <select id="regContactoGlobal" required style="padding-left: 44px; padding-right: 58px; -webkit-appearance: none; appearance: none; border-radius: 99px;">
            <option value="">Seleccionar...</option>
          </select>
          <button type="button" onclick="abrirModal('modal-nuevo')" class="search-filter-btn active" style="right: 7px;" aria-label="Crear nuevo contacto" title="Nuevo contacto">
            <span class="material-symbols-rounded">add</span>
          </button>
        </div>
      </div>
      
      <div class="input-group"><label>Fecha</label><input type="date" id="regFechaGlobal" required></div>
      <div class="input-group"><label id="lblDetalleGlobal">¿Qué hablaron?</label><textarea id="regDetalleGlobal" rows="3"></textarea></div>
      <div class="input-group"><label>Nota / Seguimiento</label><input type="text" id="regNotaGlobal"></div>
      <button type="submit" class="btn-main" id="btnGuardarRegGlobal">Guardar entrada</button>
    </form>

    <!-- HISTORIAL DE NOTAS -->
    <div class="section-heading" style="margin-top: 40px; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 24px;">
      <h2>Historial</h2>
      <p>Tus últimos registros guardados.</p>
    </div>
    <div id="listaNotas" style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
      <!-- Las notas se inyectan aquí -->
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home-btn" aria-label="Tarjetas" onclick="switchView('view-home', this)"><span class="material-symbols-rounded">view_agenda</span><span class="nav-label">Tarjetas</span></button>
    <button class="nav-item" id="nav-log-btn" aria-label="Notas" onclick="switchView('view-log', this)"><span class="material-symbols-rounded">edit_note</span><span class="nav-label">Notas</span></button>
  </nav>

  <!-- MODAL NUEVO -->
  <div class="modal-overlay" id="overlay-nuevo" onclick="cerrarModal('modal-nuevo')"></div>
  <div class="bottom-sheet" id="modal-nuevo">
    <div class="sheet-header">
      <h2>Nuevo Contacto</h2>
      <button class="close-btn" onclick="cerrarModal('modal-nuevo')"><span class="material-symbols-rounded">close</span></button>
    </div>
    <form id="formNuevoContacto">
      <div class="input-row">
        <div class="input-group"><label>Nombre *</label><input type="text" id="cNombre" required></div>
        <div class="input-group"><label>Apellido</label><input type="text" id="cApellido"></div>
      </div>
      <div class="input-row">
        <div class="input-group"><label>Apodo</label><input type="text" id="cApodo"></div>
        <div class="input-group">
          <label>Círculo</label>
          <select id="cCirculo"><option value="Amigos">Amigos</option><option value="Familia">Familia</option><option value="Trabajo">Trabajo</option><option value="Conocidos">Conocidos</option></select>
        </div>
      </div>
      <div class="input-row">
        <div class="input-group"><label for="cGenero">Género</label><select id="cGenero"><option value="">Seleccionar...</option><option value="Hombre">Hombre</option><option value="Mujer">Mujer</option></select></div>
        <div class="input-group birthday-group">
          <label for="cCumpleanos">Cumpleaños</label>
          <div class="birthday-field" id="birthdayField">
            <span class="material-symbols-rounded">calendar_month</span>
            <input type="text" id="cCumpleanos" placeholder="Elegir fecha" readonly autocomplete="off">
            <button type="button" class="birthday-clear" id="birthdayClear"><span class="material-symbols-rounded">close</span></button>
            <input type="date" id="cCumpleanosPicker" class="native-date-picker" tabindex="-1" aria-hidden="true">
          </div>
          <small class="field-hint">Se guarda solo el día y el mes.</small>
        </div>
      </div>
      <div class="input-group"><label>¿Cómo nos conocimos?</label><input type="text" id="cConocimos"></div>
      <div class="input-group"><label>Trabajo / Profesión</label><input type="text" id="cTrabajo"></div>
      <div class="input-group"><label>Preferencias de comida</label><input type="text" id="cComida"></div>
      <div class="input-row">
        <div class="input-group"><label>Relación Amorosa</label><input type="text" id="cPareja" placeholder="Nombre pareja"></div>
        <div class="input-group"><label>Mascotas</label><input type="text" id="cMascotas"></div>
      </div>
      <div class="input-group"><label>Relaciones Familiares</label><input type="text" id="cFamilia" placeholder="Hijos..."></div>
      <div class="input-group"><label>Notas / Contexto general</label><textarea id="cNotas" rows="2"></textarea></div>
      <button type="submit" class="btn-main" id="btnGuardarContacto">Crear Ficha</button>
    </form>
  </div>

  <!-- MODAL DETALLE -->
  <div class="modal-overlay" id="overlay-detalle" onclick="cerrarModal('modal-detalle')"></div>
  <div class="bottom-sheet" id="modal-detalle">
    <div class="sheet-header">
      <h2 id="detNombre" style="opacity: 0;">Oculto para dar espacio a la tarjeta</h2>
      <button class="close-btn" onclick="cerrarModal('modal-detalle')"><span class="material-symbols-rounded">close</span></button>
    </div>
    <div id="detContenido"></div>
  </div>

</div>

<div id="toast" class="toast"><span class="material-symbols-rounded">check_circle</span><span id="toastMsg">OK</span></div>

<!-- Carga de Vanilla-Tilt -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxDOA0aO-yeReiTPlm9WuaM81emgMPyqq0WOui7zZ-LcZu1fMN1R830OGwqTr4GU-cq/exec";

  let contactos = [];
  let tipoRegGlobal = 'conversacion';
  let filtroCirculo = 'Todos';
  let notasLocales = JSON.parse(localStorage.getItem('souvlaki_notas') || '[]');

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  }

  function setEstadoConexion(texto) {
    const el = document.getElementById('estadoConexion');
    if (el) el.textContent = texto || '';
  }

  window.switchView = function(viewId, btnElement) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    btnElement.classList.add('active');

    // Muestra u oculta el botón '+' global según la vista (Desaparece en Notas)
    const btnGlobalAdd = document.getElementById('btnGlobalAdd');
    if (btnGlobalAdd) {
      btnGlobalAdd.style.display = (viewId === 'view-log') ? 'none' : 'block';
    }
  };

  window.abrirModal = function(id) {
    document.getElementById(id).classList.add('active');
    document.getElementById('overlay-' + id.split('-')[1]).classList.add('active');
  };

  window.cerrarModal = function(id) {
    document.getElementById(id).classList.remove('active');
    document.getElementById('overlay-' + id.split('-')[1]).classList.remove('active');

    if (id === 'modal-detalle') {
      const allWrappers = document.querySelectorAll('.card-wrapper');
      allWrappers.forEach(w => {
        w.classList.remove('expanded', 'dimmed');
        w.style.transform = ''; 
      });
      if ('vibrate' in navigator) navigator.vibrate(10); 
    }
  };

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      document.querySelectorAll('.bottom-sheet.active').forEach(sheet => cerrarModal(sheet.id));
    }
  });

  window.setTipoRegGlobal = function(tipo) {
    tipoRegGlobal = tipo;
    const btnC = document.getElementById('btnConvGlobal');
    const btnA = document.getElementById('btnActGlobal');
    const lbl = document.getElementById('lblDetalleGlobal');
    if(tipo === 'conversacion') { btnC.classList.add('active'); btnA.classList.remove('active'); lbl.innerText = '¿Qué hablaron?'; } 
    else { btnA.classList.add('active'); btnC.classList.remove('active'); lbl.innerText = '¿Qué hicieron?'; }
  };

  async function cargarContactos() {
    setEstadoConexion('Conectando…');
    try {
      const res = await fetch(`${API_URL}?action=getContactos`, { cache: 'no-store' });
      const datosCrudos = await res.json();
      contactos = Array.isArray(datosCrudos) ? datosCrudos.filter(c => c.id_contacto && c.nombre) : [];
      localStorage.setItem('souvlaki_contactos_cache', JSON.stringify(contactos));
      renderFiltros();
      renderizarDirectorio(contactos);
      llenarSelect();
      renderNotas(); 
      setEstadoConexion(`${contactos.length} contactos`);
    } catch (e) {
      const cache = localStorage.getItem('souvlaki_contactos_cache');
      if (cache) {
        contactos = JSON.parse(cache);
        renderFiltros();
        renderizarDirectorio(contactos);
        llenarSelect();
        renderNotas();
        setEstadoConexion('Modo sin conexión');
      } else {
        setEstadoConexion('Sin conexión');
      }
    }
  }

  function getColorHash(nombre) {
    const themes = ['theme-purple', 'theme-lime', 'theme-blue', 'theme-orange', 'theme-pink', 'theme-cyan'];
    let hash = 0;
    for (let i = 0; i < nombre.length; i++) hash = nombre.charCodeAt(i) + ((hash << 5) - hash);
    return themes[Math.abs(hash) % themes.length];
  }

  window.renderizarDirectorio = function(lista) {
    const contenedor = document.getElementById('listaContactos');
    if (!lista.length) {
      contenedor.innerHTML = '<div class="empty-state">Sin contactos</div>';
      return;
    }

    contenedor.innerHTML = lista.map((c, index) => {
      const theme = getColorHash(String(c.nombre || c.id_contacto));
      const id = escapeHtml(c.id_contacto);
      
      let n = escapeHtml(c.nombre || '').trim();
      let a = escapeHtml(c.apellido || '').trim();
      let nombreLimpio = (n + ' ' + a).trim().replace(/([a-zñáéíóú])([A-ZÑÁÉÍÓÚ])/g, '$1 $2');
      
      const circulo = escapeHtml(c.circulo || 'General');
      const trabajo = c.trabajo_info ? `<div class="pill">${escapeHtml(c.trabajo_info)}</div>` : '';
      
      return `
        <div class="card-wrapper" id="wrapper-${id}" style="z-index: ${lista.length - index};">
          <div class="swipe-background"><span class="material-symbols-rounded">delete</span></div>
          <div class="swipe-container" style="transition: transform 0.3s ease;">
            <div class="wallet-card ${theme}" data-contact-id="${id}" role="button" tabindex="0">
              <div class="card-header"><div class="card-title">${nombreLimpio}</div></div>
              <div class="card-pills"><div class="pill">${circulo}</div>${trabajo}</div>
              <div class="card-action-btn"><span class="material-symbols-rounded">arrow_forward</span></div>
            </div>
          </div>
        </div>`;
    }).join('');

    if (window.VanillaTilt) {
      VanillaTilt.init(document.querySelectorAll('.wallet-card'), {
        max: 12,
        speed: 400,
        glare: true,
        'max-glare': 0.35,
        scale: 1.0,
        axis: "x", 
        gyroscope: true
      });
    }

    contenedor.querySelectorAll('.card-wrapper').forEach(wrapper => {
      const swipeContainer = wrapper.querySelector('.swipe-container');
      const card = wrapper.querySelector('.wallet-card');
      const bg = wrapper.querySelector('.swipe-background'); 
      const id = card.dataset.contactId;

      let startX = 0;
      let currentX = 0;
      let isSwiping = false;
      let hasMoved = false;

      swipeContainer.addEventListener('touchstart', e => {
        startX = e.touches[0].clientX;
        isSwiping = false;
        hasMoved = false;
        swipeContainer.style.transition = 'none'; 
      }, {passive: true});

      swipeContainer.addEventListener('touchmove', e => {
        currentX = e.touches[0].clientX;
        const diff = currentX - startX;
        
        if (diff < -15 && !wrapper.classList.contains('expanded')) {
          isSwiping = true;
          hasMoved = true;
          bg.style.opacity = '1'; 
          const move = Math.max(diff, -100); 
          swipeContainer.style.transform = `translateX(${move}px)`;
        }
      }, {passive: true});

      swipeContainer.addEventListener('touchend', e => {
        if (!hasMoved) return; 
        swipeContainer.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        const diff = currentX - startX;

        if (diff < -65) { 
          if ('vibrate' in navigator) navigator.vibrate([15, 40, 15]); 
          const c = contactos.find(x => String(x.id_contacto) === String(id));
          if (confirm(`¿Descartar a ${c.nombre}?`)) {
             borrarContacto(id, c.nombre);
          } else {
             swipeContainer.style.transform = 'translateX(0)';
             bg.style.opacity = '0'; 
          }
        } else {
          swipeContainer.style.transform = 'translateX(0)'; 
          bg.style.opacity = '0'; 
        }
        
        setTimeout(() => { isSwiping = false; hasMoved = false; }, 50); 
      });

      const openWallet = () => {
        if (isSwiping || hasMoved) return; 
        if ('vibrate' in navigator) navigator.vibrate(12);

        const c = contactos.find(x => String(x.id_contacto) === String(id));
        if (!c) return;

        const allWrappers = document.querySelectorAll('.card-wrapper');
        allWrappers.forEach(w => {
          if (w === wrapper) {
            const rect = w.getBoundingClientRect();
            const moveY = 75 - rect.top; 
            w.classList.add('expanded');
            w.style.transform = `translateY(${moveY}px) scale(1.02)`;
          } else {
            w.classList.add('dimmed');
          }
        });

        setTimeout(() => { abrirDetalle(c); }, 150);
      };

      card.addEventListener('click', openWallet);
      card.addEventListener('keydown', e => { if (e.key === 'Enter') openWallet(); });
    });
  };

  // Función actualizada para renderizar el historial con Tipo de Nota Explicito
  window.renderNotas = function() {
    const contenedor = document.getElementById('listaNotas');
    if (!contenedor) return;

    if (!notasLocales.length) {
      contenedor.innerHTML = '<div class="empty-state" style="padding: 20px;">No hay registros recientes.</div>';
      return;
    }

    const reversa = [...notasLocales].reverse();
    contenedor.innerHTML = reversa.map(n => {
      const c = contactos.find(x => String(x.id_contacto) === String(n.contactoId));
      let nombre = 'Desconocido';
      if (c) {
         let n_text = escapeHtml(c.nombre || '').trim();
         let a_text = escapeHtml(c.apellido || '').trim();
         nombre = (n_text + ' ' + a_text).trim().replace(/([a-zñáéíóú])([A-ZÑÁÉÍÓÚ])/g, '$1 $2');
      }
      
      const tipoTexto = n.tipo === 'conversacion' ? 'Conversación' : 'Actividad';
      const icono = n.tipo === 'conversacion' ? 'forum' : 'local_activity';
      
      return `
        <div style="background: var(--input-bg); padding: 16px; border-radius: 16px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px; align-items: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <strong style="font-size: 0.95rem;">${nombre}</strong> 
              <span style="font-size: 0.65rem; background: rgba(0,0,0,0.06); padding: 4px 8px; border-radius: 99px; font-weight: 700; color: var(--text-muted);">${tipoTexto}</span>
            </div>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${escapeHtml(n.fecha)}</span>
          </div>
          <div style="font-size: 0.85rem; display: flex; gap: 6px; align-items: flex-start; margin-bottom: ${n.nota ? '4px' : '0'};">
            <span class="material-symbols-rounded" style="font-size: 1rem; color: var(--text-muted);">${icono}</span>
            <span>${escapeHtml(n.detalle)}</span>
          </div>
          ${n.nota ? `<div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(0,0,0,0.05);">${escapeHtml(n.nota)}</div>` : ''}
        </div>
      `;
    }).join('');
  };

  window.abrirDetalle = function(c) {
    let n = escapeHtml(c.nombre || '').trim();
    let a = escapeHtml(c.apellido || '').trim();
    let nombreHeader = (n + ' ' + a).trim().replace(/([a-zñáéíóú])([A-ZÑÁÉÍÓÚ])/g, '$1 $2');
    
    if (c.apodo) nombreHeader += ` "${escapeHtml(c.apodo)}"`;
    document.getElementById('detNombre').innerText = nombreHeader;
    
    let html = ``;
    let datosPersonales = '';
    
    if(c.cumpleanos) {
      let fechaLimpia = c.cumpleanos;
      if (fechaLimpia.includes('T')) {
        const partes = fechaLimpia.split('T')[0].split('-'); 
        if(partes.length === 3) fechaLimpia = `${partes[2]}/${partes[1]}/${partes[0]}`; 
        else fechaLimpia = fechaLimpia.split('T')[0];
      }
      datosPersonales += `<div class="detail-item"><span><strong>Cumpleaños:</strong> ${escapeHtml(fechaLimpia)}</span></div>`;
    }

    if(c.genero) datosPersonales += `<div class="detail-item"><span><strong>Género:</strong> ${escapeHtml(c.genero)}</span></div>`;
    if(c.trabajo_info) datosPersonales += `<div class="detail-item"><span><strong>Trabajo:</strong> ${escapeHtml(c.trabajo_info)}</span></div>`;
    if(c.como_nos_conocimos) datosPersonales += `<div class="detail-item"><span><strong>Nos conocimos:</strong> ${escapeHtml(c.como_nos_conocimos)}</span></div>`;
    if(c.comida_pref) datosPersonales += `<div class="detail-item"><span><strong>Comida:</strong> ${escapeHtml(c.comida_pref)}</span></div>`;
    if(datosPersonales !== '') html += `<div class="detail-section"><div class="detail-title">Información Personal</div>${datosPersonales}</div>`;

    let circuloCercano = '';
    if(c.pareja_info) circuloCercano += `<div class="detail-item"><span><strong>Pareja:</strong> ${escapeHtml(c.pareja_info)}</span></div>`;
    if(c.familia_info) circuloCercano += `<div class="detail-item"><span><strong>Familia:</strong> ${escapeHtml(c.familia_info)}</span></div>`;
    if(c.mascotas) circuloCercano += `<div class="detail-item"><span><strong>Mascotas:</strong> ${escapeHtml(c.mascotas)}</span></div>`;
    if(circuloCercano !== '') html += `<div class="detail-section"><div class="detail-title">Círculo Cercano</div>${circuloCercano}</div>`;

    if(c.notas_generales) html += `<div class="detail-section"><div class="detail-title">Notas</div><div class="detail-item"><span>${escapeHtml(c.notas_generales)}</span></div></div>`;

    html += `
      <button class="btn-main" style="width: 100%;" onclick="irARegistroRapido('${c.id_contacto}')">
        <span class="material-symbols-rounded">edit_square</span> Registrar interacción
      </button>
      <button class="btn-danger" style="width: 100%;" onclick="borrarContacto('${c.id_contacto}', '${c.nombre}')">
        <span class="material-symbols-rounded">delete</span> Borrar Ficha
      </button>
    `;

    document.getElementById('detContenido').innerHTML = html;
    abrirModal('modal-detalle');
  };

  window.irARegistroRapido = function(idContacto) {
    cerrarModal('modal-detalle');
    switchView('view-log', document.getElementById('nav-log-btn'));
    document.getElementById('regContactoGlobal').value = idContacto;
  };

  window.borrarContacto = async function(id, nombre) {
    cerrarModal('modal-detalle');
    mostrarToast("Borrando...");
    try {
      await fetch(`${API_URL}?action=deleteContacto&id_contacto=${encodeURIComponent(id)}`);
      mostrarToast("Contacto eliminado");
      cargarContactos();
    } catch (e) { mostrarToast("Error al borrar"); }
  };

  window.filtrarContactos = function() {
    const q = document.getElementById('inputBuscar').value.trim().toLowerCase();
    const filtrados = contactos.filter(c => {
      const texto = [c.nombre,c.apellido,c.apodo,c.circulo,c.trabajo_info,c.comida_pref,c.pareja_info,c.familia_info,c.mascotas,c.notas_generales].filter(Boolean).join(' ').toLowerCase();
      return texto.includes(q) && (filtroCirculo === 'Todos' || String(c.circulo || 'General') === filtroCirculo);
    });
    renderizarDirectorio(filtrados);
  };

  function renderFiltros() {
    const el = document.getElementById('filtrosCirculo');
    if (!el) return;
    const valores = ['Todos', ...new Set(contactos.map(c => c.circulo || 'General'))];
    el.innerHTML = valores.map(v => `<button type="button" class="filter-chip ${v === filtroCirculo ? 'active' : ''}" data-filter="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('');
    el.querySelectorAll('.filter-chip').forEach(btn => btn.addEventListener('click', () => {
      filtroCirculo = btn.dataset.filter;
      renderFiltros();
      filtrarContactos();
    }));
  }

  window.llenarSelect = function() {
    const s = document.getElementById('regContactoGlobal');
    s.innerHTML = '<option value="">Seleccionar...</option>';
    contactos.forEach(c => s.innerHTML += `<option value="${c.id_contacto}">${c.nombre} ${c.apellido || ''}</option>`);
  };

  window.mostrarToast = function(msg) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  };

  document.addEventListener('DOMContentLoaded', () => {
    const btnFiltro = document.getElementById('btnFiltro');
    const panel = document.getElementById('panelFiltros');
    btnFiltro.addEventListener('click', (e) => {
      e.stopPropagation();
      panel.classList.toggle('open');
      btnFiltro.classList.toggle('active', panel.classList.contains('open'));
    });

    document.getElementById('formRegistroGlobal').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnGuardarRegGlobal');
      btn.disabled = true; btn.innerText = 'Guardando...';

      const id = document.getElementById('regContactoGlobal').value;
      const fecha = document.getElementById('regFechaGlobal').value;
      const detalle = encodeURIComponent(document.getElementById('regDetalleGlobal').value);
      const nota = encodeURIComponent(document.getElementById('regNotaGlobal').value);
      const accion = tipoRegGlobal === 'conversacion' ? 'addConversacion' : 'addActividad';
      const paramsExtras = tipoRegGlobal === 'conversacion' ? `que_dijimos=${detalle}` : `que_hicimos=${detalle}`;
      
      try {
        const res = await fetch(`${API_URL}?id_contacto=${encodeURIComponent(id)}&fecha=${encodeURIComponent(fecha)}&action=${accion}&${paramsExtras}&nota=${nota}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        mostrarToast("Registro exitoso");
        
        notasLocales.push({
          contactoId: id,
          fecha: fecha,
          tipo: tipoRegGlobal,
          detalle: decodeURIComponent(detalle),
          nota: decodeURIComponent(nota)
        });
        localStorage.setItem('souvlaki_notas', JSON.stringify(notasLocales));
        renderNotas();
        
        document.getElementById('formRegistroGlobal').reset();
        switchView('view-home', document.getElementById('nav-home-btn'));
      } catch (err) { 
        mostrarToast("Error al guardar"); 
      } finally { 
        btn.disabled = false; btn.innerText = 'Guardar entrada'; 
      }
    });

    document.getElementById('formNuevoContacto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnGuardarContacto');
      btn.disabled = true; btn.innerText = 'Creando...';

      const p = (id) => encodeURIComponent(document.getElementById(id).value);
      const url = `${API_URL}?action=addContacto&nombre=${p('cNombre')}&apellido=${p('cApellido')}&apodo=${p('cApodo')}&genero=${p('cGenero')}&cumpleanos=${p('cCumpleanos')}&como_nos_conocimos=${p('cConocimos')}&trabajo_info=${p('cTrabajo')}&comida_pref=${p('cComida')}&pareja_info=${p('cPareja')}&familia_info=${p('cFamilia')}&mascotas=${p('cMascotas')}&notas_generales=${p('cNotas')}&circulo=${p('cCirculo')}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        mostrarToast("Contacto creado");
        document.getElementById('formNuevoContacto').reset();
        cerrarModal('modal-nuevo');
        cargarContactos();
      } catch (err) { 
        mostrarToast("Error al guardar"); 
      } finally { 
        btn.disabled = false; btn.innerText = 'Crear Ficha'; 
      }
    });

    renderNotas(); 
    cargarContactos();
  });
</script>
